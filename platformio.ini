; PlatformIO project configuration for ESP32_SSL_MCU
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
; Arduino core 3.x (ESP-IDF 5): the sketch uses the IDF 5 MQTT client configuration.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=3
